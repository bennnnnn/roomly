name: Expire listings cron

on:
  schedule:
    # Daily at 06:00 UTC — unpublish listings past expires_at (PRD §3.8).
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  expire-due-listings:
    name: POST expire-listings
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call expire-listings Edge Function
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Skip: SUPABASE_URL and CRON_SECRET must be set as GitHub repository secrets."
            exit 0
          fi
          curl -sf -X POST \
            "${SUPABASE_URL%/}/functions/v1/expire-listings" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{}'
